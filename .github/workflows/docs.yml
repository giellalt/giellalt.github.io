name: Docs
on:
  push:
    branches:
      - main
      # Temporary: publish this refactor branch to Pages for testing.
      # Remove before/after merging.
      - refactor-table-js-esm
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    uses: giellalt/.github/.github/workflows/docs.yml@jekyll4-minification
    with:
      docs_dir: '.'
      prebuild_script: 'docs-prebuild.sh'
    secrets: inherit
