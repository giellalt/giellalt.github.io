name: Docs
on:
  push:
    branches:
      - main
      - jekyll4-modernization
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    uses: giellalt/.github/.github/workflows/docs.yml@main
    with:
      docs_dir: '.'
      prebuild_script: 'docs-prebuild.sh'
    secrets: inherit
