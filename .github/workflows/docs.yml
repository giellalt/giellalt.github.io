name: Docs
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    # TESTING: pinned to the sync-ci-local-deps branch until that PR merges
    # to main, then this should go back to @main.
    uses: giellalt/.github/.github/workflows/docs.yml@sync-ci-local-deps
    with:
      docs_dir: '.'
      prebuild_script: 'docs-prebuild.sh'
    secrets: inherit
