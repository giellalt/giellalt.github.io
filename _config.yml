theme: jekyll-theme-giellalt

# Org pages site — served at the domain root. Only takes effect for local
# `jekyll build`/`serve`, where nothing else sets these and
# jekyll-github-metadata's own guess resolves them wrongly under Jekyll 4
# without an API token. In CI the shared giellalt/.github workflow always
# overrides both with the real Pages deployment's origin/base_path, merged
# in last via `--config`, so this has no effect on the production build.
url: "https://giellalt.github.io"
baseurl: ""

title: GiellaLT

description: <a href="/AboutGiellaLT.html">GiellaLT</a> provides an infrastructure for rule-based language technology aimed at minority and indigenous languages, and streamlines building anything from keyboards to speech technology. Read <a href="https://indigenous-langtech.uit.no">more about why</a>, and see also our <a href="/Personvern.html">privacy document</a>.

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  syntax_highlighter_opts:
    disable: true

# repository: fallback for jekyll-github-metadata when PAGES_REPO_NWO isn't
# set (e.g. a local build run with JEKYLL_ENV=production, which skips its
# git-origin-remote autodetection) — see its RepositoryFinder.
# source_dir: the theme's default.html builds "Edit on GitHub" links assuming
# docs live under docs/ (true for every other consumer); this site's docs
# are at the repo root, so it needs '' here to not prepend a wrong docs/.
repository: giellalt/giellalt.github.io
source_dir: ""

# Only entries not already covered by Jekyll itself: it never processes
# dotfiles/dotdirs (.git, .github, .gitignore, .sass-cache, .jekyll-cache,
# .bundle, ...) and DEFAULT_EXCLUDES already covers Gemfile, Gemfile.lock,
# node_modules, and vendor/{bundle,cache,gems,ruby}/ — verified empirically
# by building with those dropped and checking _site for leaks. vendor/
# (bare) stays: it's broader than Jekyll's vendor/bundle/ etc. subpaths.
exclude:
  - "infra/test-slidev.sh"
  - "docs-prebuild.sh"
  - "fetch_github_repos.rb"
  - "package.json"
  - "package-lock.json"
  - "vendor/"
  - "README.md"
  - "assets/js/README.md"
  - "*-slidev/"

# Keep raw Slidev files accessible
keep_files:
  - "*-slidev"
