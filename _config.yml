remote_theme: giellalt/jekyll-theme-giellalt@main

title: GiellaLT

description: <a href="/AboutGiellaLT.html">GiellaLT</a> provides an infrastructure for rule-based language technology aimed at minority and indigenous languages, and streamlines building anything from keyboards to speech technology. Read <a href="https://indigenous-langtech.uit.no">more about why</a>, and see also our <a href="/Personvern.html">privacy document</a>.


plugins:
  - jekyll-default-layout
  - jekyll-gist
  - jekyll-github-metadata
  - jekyll-include-cache
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-titles-from-headings
  - jemoji

# SASS/SCSS compression
sass:
  style: compressed
# HTML/CSS/JS are further minified after the build by the "Minify" workflow step
# (giellalt/.github .github/actions/minify).

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  syntax_highlighter_opts:
    disable: true

# GitHub Pages kompatibilitet
repository: giellalt/giellalt.github.io
source_dir: ""

# Exclude problematic files from Jekyll processing
exclude:
  - "infra/test-slidev.sh"
  - "package.json"
  - "package-lock.json"
  - "node_modules/"
  - "vendor/"
  - "Gemfile"
  - "Gemfile.lock"
  - "README.md"
  - ".git/"
  - ".github/"
  - ".gitignore"
  - ".sass-cache/"
  - ".jekyll-cache/"
  - ".bundle/"
  - "*-slidev/"
  - "vendor/bundle/"
  - "vendor/cache/"
  - "vendor/gems/"
  - "vendor/ruby/"

# Keep raw Slidev files accessible
keep_files:
  - "*-slidev"
