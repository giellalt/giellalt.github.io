theme: jekyll-theme-giellalt

# Org pages site — served at the domain root. Only takes effect for local
# `jekyll build`/`serve`, where nothing else sets these and
# jekyll-github-metadata's own guess resolves them wrongly under Jekyll 4
# without an API token. In CI the shared giellalt/.github workflow always
# overrides both with the real Pages deployment's origin/base_path, merged
# in last via `--config`, so this has no effect on the production build.
url: "https://giellalt.github.io"
baseurl: ""

title: GiellaLT

description: <a href="/AboutGiellaLT.html">GiellaLT</a> provides an infrastructure for rule-based language technology aimed at minority and indigenous languages, and streamlines building anything from keyboards to speech technology. Read <a href="https://indigenous-langtech.uit.no">more about why</a>, and see also our <a href="/Personvern.html">privacy document</a>.


# jekyll-theme-giellalt (the gem, see Gemfile) already requires everything
# this site used to list here (SEO tag, site.github, emoji, sitemap,
# jekyll-minifier, etc.) — jekyll-minifier only activates for
# JEKYLL_ENV=production (set by the shared CI workflow), so this builds
# unminified locally and minified in CI, same as every other consumer.

# Minification (production only, see above). HTML + JS: jekyll-minifier.
# CSS: sass below (jekyll-minifier's cssminify2 corrupts var(--x) inside
# calc()) — this one does apply unconditionally, locally too.
sass:
  style: compressed
  sourcemap: never
jekyll-minifier:
  compress_css: false
  exclude:
    - '*typosreport*'

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  syntax_highlighter_opts:
    disable: true

# GitHub Pages kompatibilitet
repository: giellalt/giellalt.github.io
source_dir: ""

# Exclude problematic files from Jekyll processing
exclude:
  - "infra/test-slidev.sh"
  - "docs-prebuild.sh"
  - "fetch_github_repos.rb"
  - "package.json"
  - "package-lock.json"
  - "node_modules/"
  - "vendor/"
  - "Gemfile"
  - "Gemfile.lock"
  - "README.md"
  - "assets/js/README.md"
  - ".git/"
  - ".github/"
  - ".gitignore"
  - ".sass-cache/"
  - ".jekyll-cache/"
  - ".bundle/"
  - "*-slidev/"
  - "vendor/bundle/"
  - "vendor/cache/"
  - "vendor/gems/"
  - "vendor/ruby/"

# Keep raw Slidev files accessible
keep_files:
  - "*-slidev"
